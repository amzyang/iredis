[project]
name = "iredis"
version = "2.4.6"
description = "Terminal client for Redis with auto-completion and syntax highlighting."
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "laixintao", email = "laixintao1995@163.com" }]
keywords = ["Commandline tools", "Redis", "Redis Client", "key-value store"]
classifiers = [
  # see https://pypi.org/pypi?%3Aaction=list_classifiers
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Console :: Curses",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
]
dependencies = [
  "click>=8.0",
  "configobj>=5.0",
  "mistune>=3.0",
  "packaging>=24.2",  # >=3.0.29 for prompt_toolkit.cursor_shapes (vi mode modal cursor)
  "prompt-toolkit>=3.0.29",
  "pygments>=2",
  "python-dateutil>=2.8.2",
  "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/amzyang/iredis"
Repository = "https://github.com/amzyang/iredis"

[project.scripts]
iredis = "iredis.entry:main"

[project.optional-dependencies]
# crash telemetry, see iredis/sentry.py; without it telemetry silently stays off
sentry = ["sentry-sdk>=2"]

[dependency-groups]
dev = [
  "freezegun>=1.4.0",
  "pexpect>=4.7",
  "pyte>=0.8",
  "pytest>=8.0",
  "ruff>=0.14",
  "ty>=0.0.1a21",
]

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = ["redis-doc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]

[tool.ty.src]
exclude = ["tests", "scripts"]

[tool.uv.build-backend]
# flat layout: the iredis package lives at the repository root
module-root = ""
